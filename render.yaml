services:
  - type: web
    name: petstore-backend
    runtime: docker
    rootDir: backend
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: petstore-db
          property: connectionString

  - type: web
    name: petstore-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://petstore-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: petstore-db
    plan: free
    databaseName: petstore
    user: petstore