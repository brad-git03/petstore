# Render Production Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
server.port=${PORT:8080}
server.address=0.0.0.0

# Allow the Render frontend and local development origins
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:4173,https://*.onrender.com}

# JPA/Hibernate for Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging in Production
logging.level.root=WARN
logging.level.com.manalese.petstore=INFO
logging.level.org.springframework.web=WARN
